# ────────────────────────────────────────────────────────────────────────────
# Humor LoRA Fine-Tuning Configuration
# for Qwen2.5-VL-3B-Instruct on Memotion 3
# ────────────────────────────────────────────────────────────────────────────
# This config is designed for an external GPU environment (Colab/RunPod/AWS).
# DO NOT attempt training on a CPU-only machine.
# ────────────────────────────────────────────────────────────────────────────

model:
  id: "Qwen/Qwen2.5-VL-3B-Instruct"
  quantization: "4bit"  # QLoRA; set to "none" if GPU has ≥24GB VRAM
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Qwen2.5-VL attention and MLP projection layers
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  # Paths relative to the project root
  train_path: "data/memotion3_processed/train.jsonl"
  val_path: "data/memotion3_processed/validation.jsonl"
  test_path: "data/memotion3_processed/test.jsonl"
  images_dir: "data/processed/images"
  max_seq_length: 512

  # Class distribution (from preprocessing):
  #   HUMOR:     5980 (85.7%)
  #   NON-HUMOR: 1000 (14.3%)
  #   Imbalance ratio: 6.0:1
  class_weights:
    HUMOR: 1.0
    NON-HUMOR: 5.98  # inverse frequency weight to counter imbalance

training:
  output_dir: "models/qwen2.5-vl-3b-humor-lora"
  logs_dir: "results/humor_lora_training/logs"
  metrics_dir: "results/humor_lora_training/metrics"

  epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4  # effective batch size = 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optim: "paged_adamw_32bit"
  bf16: true
  fp16: false

  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  logging_steps: 10

  # Checkpoint selection: use balanced accuracy (not just loss/recall)
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  load_best_model_at_end: true

  early_stopping_patience: 5
  seed: 42
